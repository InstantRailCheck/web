version: 2
updates:
  # npm dependencies — Dependabot's security-update path (separate from this
  # schedule) opens PRs for known-vulnerable versions as soon as an advisory
  # is published, regardless of this weekly cadence; this section covers
  # routine version-bump PRs so dependencies don't just quietly go stale.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Most @types/*, eslint, and other dev-only bumps are low-risk and
      # noisy one at a time — bundle them into a single PR to review instead
      # of a dozen near-identical ones.
      #
      # Restricted to patch releases only: dependabot-automerge.yml's 0.x
      # guard checks fetch-metadata's singular `previous-version` output,
      # which for a grouped PR is just the *first* dependency in the group,
      # not an aggregate — so a minor/major bump hiding among several
      # grouped patch bumps could dodge the guard by reporting an unrelated
      # dependency's version. Keeping minor/major dev bumps ungrouped means
      # each becomes its own PR, where the singular outputs are always
      # correct for that one dependency.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
      # react and react-dom are versioned in lockstep by the React team —
      # every release bumps both to the exact same version number
      # simultaneously. Without grouping, Dependabot opens a PR bumping
      # react-dom alone, which can never install: react-dom's peer
      # dependency requires the identical react version, and react stays
      # behind at its old pin. This is exactly what happened repeatedly
      # before this group existed (react-dom 19.2.7 -> 19.2.8 alone,
      # npm ci failing with ERESOLVE on every retry). Unlike
      # dev-dependencies above, this isn't restricted to patch releases —
      # since both packages' version numbers are always textually
      # identical, fetch-metadata's previous-version/update-type outputs
      # for "the first dependency in the group" are accurate for the whole
      # group here regardless of bump size, so dependabot-automerge.yml's
      # patch/minor-only guard still works correctly.
      react:
        patterns:
          - "react"
          - "react-dom"
    ignore:
      # @types/node is intentionally capped to the ^24 range to match the
      # Node 24.x runtime this project targets (package.json's engines
      # field, Vercel's project setting) — a semver-major bump here (e.g.
      # to 26.x) would pull in types for a Node version we're not actually
      # running on yet. Remove this rule only when intentionally upgrading
      # the runtime itself to Node 26 LTS.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # eslint 10 is a real, upstream incompatibility, not something this
      # repo can fix — eslint-config-next@16.2.12 bundles
      # eslint-plugin-react@7.37.5 (the latest release as of 2026-08-10),
      # whose react/display-name rule calls a rule-context method ESLint 10
      # removed, throwing "contextOrFilename.getFilename is not a
      # function" on every lint run. Confirmed no newer eslint-plugin-react
      # exists yet to bump to instead. Remove this rule once
      # eslint-config-next (or its bundled eslint-plugin-react) ships
      # ESLint 10 support — check `npm view eslint-plugin-react versions`
      # for a release past 7.37.5 first.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  # Actions are pinned to commit SHAs (see .github/workflows/*.yml) as
  # defense in depth against a compromised/republished version tag —
  # Dependabot still tracks and opens PRs to bump the pinned SHA forward
  # when a new release exists, so that pinning doesn't silently calcify.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
